name: Sync upstream

on:
  schedule:
    # Daily at 03:17 UTC (11:17 Asia/Shanghai).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Gorvey/nodewarden'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A repository-scoped SSH deploy key can also sync upstream workflow
      # changes. GITHUB_TOKEN cannot grant workflows:write to itself.
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}

      - name: Merge upstream without overwriting fork configuration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/shuaiplus/nodewarden.git
          git fetch --no-tags upstream main
          before=$(git rev-parse HEAD)
          upstream=$(git rev-parse upstream/main)
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo 'Already up to date with upstream.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Conflicts fail the job instead of discarding local configuration.
          git merge --no-edit upstream/main
          git push origin HEAD:main
          {
            echo "Synced upstream commit: $upstream"
            echo "Previous fork commit: $before"
            echo 'Cloudflare Workers Builds deploys the resulting main push.'
            echo 'Check the Cloudflare build separately; sync success is not deployment success.'
          } >> "$GITHUB_STEP_SUMMARY"
